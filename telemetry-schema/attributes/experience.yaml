file_format: definition/2
attributes:
  - key: app.synthetic_request
    type: boolean
    brief: Whether the browser request was generated by automated traffic
    stability: stable
  - key: app.experience.name
    type:
      members:
        - id: astronomy
          value: astronomy
        - id: banking
          value: banking
        - id: healthcare
          value: healthcare
        - id: travel
          value: travel
        - id: insurance
          value: insurance
        - id: ai
          value: ai
    brief: Active customer-facing application experience
    stability: stable
    note: A validated, bounded presentation context. It is not an authorization or resource attribute.
  - key: app.experience.next
    type:
      members:
        - id: astronomy
          value: astronomy
        - id: banking
          value: banking
        - id: healthcare
          value: healthcare
        - id: travel
          value: travel
        - id: insurance
          value: insurance
        - id: ai
          value: ai
    brief: Application experience selected by an experience-switch action
    stability: stable
  - key: app.user_journey
    type:
      members:
        - id: browse_to_purchase
          value: browse_to_purchase
        - id: bill_payment
          value: bill_payment
        - id: patient_bill_payment
          value: patient_bill_payment
        - id: flight_search_booking
          value: flight_search_booking
        - id: coverage_selection
          value: coverage_selection
        - id: ai_assistant_chat
          value: ai_assistant_chat
        - id: experience_switch
          value: experience_switch
    brief: Bounded user journey represented by an industry experience
    stability: stable
  - key: app.action.name
    type:
      members:
        - id: move_money
          value: move_money
        - id: manage_cards
          value: manage_cards
        - id: deposit_check
          value: deposit_check
        - id: schedule_visit
          value: schedule_visit
        - id: message_care_team
          value: message_care_team
        - id: view_health_records
          value: view_health_records
        - id: start_claim
          value: start_claim
        - id: policy_documents
          value: policy_documents
        - id: talk_to_advisor
          value: talk_to_advisor
        - id: search_stays
          value: search_stays
        - id: search_cars
          value: search_cars
        - id: contact_support
          value: contact_support
        - id: patient_support
          value: patient_support
        - id: claims_center
          value: claims_center
        - id: travel_support
          value: travel_support
    brief: Bounded guided action selected within an industry experience
    stability: stable
  - key: app.ai.intent
    type:
      members:
        - id: brainstorm
          value: brainstorm
        - id: calculate
          value: calculate
        - id: explain
          value: explain
        - id: general
          value: general
        - id: greeting
          value: greeting
        - id: plan
          value: plan
        - id: rewrite
          value: rewrite
        - id: summarize
          value: summarize
    brief: Bounded user intent handled by the AI assistant
    stability: stable
  - key: app.ai.response_mode
    type:
      members:
        - id: embedded_backend
          value: embedded_backend
        - id: agent
          value: agent
        - id: agent_fallback
          value: agent_fallback
        - id: client_fallback
          value: client_fallback
    brief: Response generation mode used by the AI assistant
    stability: stable
  - key: app.backend.domain
    type: string
    brief: Customer-facing domain represented by a frontend API request
    stability: stable
    note: Values are selected from the checked-in experience registry and never from user input.
  - key: app.backend.resource
    type: string
    brief: Low-cardinality logical backend resource used by an experience operation
    stability: stable
  - key: app.backend.original_route
    type: string
    brief: Generic Astronomy Shop frontend API route implemented behind an experience-specific route
    stability: stable
  - key: app.product.id
    type: string
    brief: Stable catalog product identifier
    stability: stable
  - key: app.order.id
    type: string
    brief: Order confirmation identifier
    stability: stable
  - key: app.record.id
    type: string
    brief: Stable identifier for a fictional domain record in a non-Astronomy experience
    stability: stable
  - key: app.transaction.id
    type: string
    brief: Confirmation identifier returned by a non-Astronomy frontend transaction
    stability: stable
  - key: app.operation.name
    type: string
    brief: Experience-specific low-cardinality operation name attached to browser and frontend API spans
    stability: stable
    note: Values come from the checked-in per-industry telemetry vocabulary and never from user input.
  - key: app.workflow.step
    type:
      members:
        - id: home_viewed
          value: home_viewed
        - id: catalog_load
          value: catalog_load
        - id: records_load
          value: records_load
        - id: currency_load
          value: currency_load
        - id: detail_load
          value: detail_load
        - id: selection_add
          value: selection_add
        - id: cart_load
          value: cart_load
        - id: review_load
          value: review_load
        - id: cart_state_sync
          value: cart_state_sync
        - id: selection_state_sync
          value: selection_state_sync
        - id: fee_calculation
          value: fee_calculation
        - id: transaction_submit
          value: transaction_submit
        - id: confirmation_rendered
          value: confirmation_rendered
        - id: confirmation_unavailable
          value: confirmation_unavailable
        - id: draft_reset
          value: draft_reset
        - id: ad_load
          value: ad_load
        - id: guidance_load
          value: guidance_load
        - id: recommendations_load
          value: recommendations_load
        - id: related_records_load
          value: related_records_load
        - id: search_submit
          value: search_submit
        - id: route_swap
          value: route_swap
        - id: guided_action_open
          value: guided_action_open
        - id: guided_action_complete
          value: guided_action_complete
        - id: prompt_submitted
          value: prompt_submitted
        - id: response_completed
          value: response_completed
        - id: chat_opened
          value: chat_opened
        - id: response_copied
          value: response_copied
        - id: new_chat_started
          value: new_chat_started
        - id: conversation_loaded
          value: conversation_loaded
        - id: apply
          value: apply
    brief: Bounded step in an application journey
    stability: stable
